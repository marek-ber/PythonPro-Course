{% load static %}

<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <title>Widok Kategorii</title>
    <link rel="stylesheet" href="{% static 'article/style.css' %}">
</head>

<body>
    <h1>{{ category.name }}</h1>

<ul>
    {% for article in articles %}
        <li>{{ article.title }}</li>
    {% empty %}
        <li>Brak artykułów</li>
    {% endfor %}
</ul>

 
</body>

</html>
