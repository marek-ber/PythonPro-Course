<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form method="get">
    {% csrf_token %} <!-- Ważne zabezpieczenie przed atakami CSRF! -->
    {{ form.as_p }} <!-- Django wygeneruje pola formularza jako
paragrafy <p> -->
    <button type="submit">Wyślij</button>
</form>
         <ul>
        {% for post in posts %}
        <li>
            <h2>{{ post.title }}</h2>
            <p>Opublikowano: {{ post.published_date|date:"d.m.Y" }}</p>
            
        </li>
        {% endfor %}
    </ul>
</body>
</html>
