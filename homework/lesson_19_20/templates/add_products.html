
{% block content %}
<h2>Dodaj produkt:</h2>
<p style="color: red;">{{ error }}</p>
<form method="post">
    {% csrf_token %} <!-- Ważne zabezpieczenie przed atakami CSRF! -->
    {{ form.as_p }} <!-- Django wygeneruje pola formularza jako
paragrafy <p> -->
    <button type="submit">Dodaj</button>
</form>
{% endblock %}
