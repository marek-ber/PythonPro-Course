<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>{{ page_title }}</title>
</head>
<body>
    <h1>{{ page_title }}</h1>

    {% for image in images %}
        <div style="margin-bottom: 25px;">
            <img src="{{ image.url }}" alt="{{ image.caption }}" width="500">
            <p>{{ image.caption }}</p>
        </div>
    {% endfor %}

    <p><a href="/">Powrót</a></p>
</body>
</html>
