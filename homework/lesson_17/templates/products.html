<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>{{ page_title }}</title>
</head>
<body>
    <h1>{{ page_title }}</h1>

    {% if products %}
        <table border="1" cellpadding="8">
            <thead>
                <tr>
                    <th>Nazwa</th>
                    <th>Cena</th>
                </tr>
            </thead>
            <tbody>
                {% for product in products %}
                    <tr>
                        <td>{{ product.name }}</td>
                        <td>{{ "%.2f"|format(product.price) }} zł</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    {% else %}
        <p>Brak produktów. Wejdź najpierw na <a href="/init-db">/init-db</a>.</p>
    {% endif %}

    <p><a href="/">Powrót</a></p>
</body>
</html>
