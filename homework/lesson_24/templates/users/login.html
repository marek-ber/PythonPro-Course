{% extends "base.html" %}

{% block content %}
<div class="content-section">
    <h2>Logowanie</h2>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Zaloguj</button>
    </form>

    <p>Nie masz konta? <a href="{% url 'register' %}">Zarejestruj się</a></p>
    <p><a href="{% url 'next-info' %}">Jak działa parametr next?</a></p>
</div>
{% endblock content %}
